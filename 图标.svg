<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. 纯黑色圆角底 -->
  <rect width="512" height="512" rx="120" fill="#0A0A0A" />
  
  <!-- 外框已移除 -->

  <!-- ================= 核心太极图 ================= -->
  <g transform="translate(256, 256)">
    <!-- 黑色阴鱼 -->
    <path d="M 0,-95 A 95,95 0 0,1 0,95 A 47.5,47.5 0 0,0 0,0 A 47.5,47.5 0 0,1 0,-95 Z" fill="#111111" />
    <!-- 金色阳鱼 -->
    <path d="M 0,-95 A 95,95 0 0,0 0,95 A 47.5,47.5 0 0,1 0,0 A 47.5,47.5 0 0,0 0,-95 Z" fill="#FFC800" />
    
    <!-- 阴阳眼 -->
    <circle cx="0" cy="-47.5" r="14" fill="#111111" />
    <circle cx="0" cy="47.5" r="14" fill="#FFC800" />
    
    <!-- 太极外圈描边 -->
    <circle cx="0" cy="0" r="95" stroke="#FFC800" stroke-width="6" fill="none" />
  </g>

  <!-- ================= 外围先天八卦 ================= -->
  <g fill="#FFC800">
    <!-- 正上：乾 -->
    <g transform="translate(256, 256) rotate(0) translate(0, -160)">
      <rect x="-30" y="-20" width="60" height="10"/>
      <rect x="-30" y="0" width="60" height="10"/>
      <rect x="-30" y="20" width="60" height="10"/>
    </g>
    <!-- 右上：巽 -->
    <g transform="translate(256, 256) rotate(45) translate(0, -160)">
      <rect x="-30" y="-20" width="60" height="10"/>
      <rect x="-30" y="0" width="60" height="10"/>
      <rect x="-30" y="20" width="24" height="10"/>
      <rect x="6" y="20" width="24" height="10"/>
    </g>
    <!-- 正右：坎 -->
    <g transform="translate(256, 256) rotate(90) translate(0, -160)">
      <rect x="-30" y="-20" width="24" height="10"/>
      <rect x="6" y="-20" width="24" height="10"/>
      <rect x="-30" y="0" width="60" height="10"/>
      <rect x="-30" y="20" width="24" height="10"/>
      <rect x="6" y="20" width="24" height="10"/>
    </g>
    <!-- 右下：艮 -->
    <g transform="translate(256, 256) rotate(135) translate(0, -160)">
      <rect x="-30" y="-20" width="60" height="10"/>
      <rect x="-30" y="0" width="24" height="10"/>
      <rect x="6" y="0" width="24" height="10"/>
      <rect x="-30" y="20" width="24" height="10"/>
      <rect x="6" y="20" width="24" height="10"/>
    </g>
    <!-- 正下：坤 -->
    <g transform="translate(256, 256) rotate(180) translate(0, -160)">
      <rect x="-30" y="-20" width="24" height="10"/>
      <rect x="6" y="-20" width="24" height="10"/>
      <rect x="-30" y="0" width="24" height="10"/>
      <rect x="6" y="0" width="24" height="10"/>
      <rect x="-30" y="20" width="24" height="10"/>
      <rect x="6" y="20" width="24" height="10"/>
    </g>
    <!-- 左下：震 -->
    <g transform="translate(256, 256) rotate(225) translate(0, -160)">
      <rect x="-30" y="-20" width="24" height="10"/>
      <rect x="6" y="-20" width="24" height="10"/>
      <rect x="-30" y="0" width="24" height="10"/>
      <rect x="6" y="0" width="24" height="10"/>
      <rect x="-30" y="20" width="60" height="10"/>
    </g>
    <!-- 正左：离 -->
    <g transform="translate(256, 256) rotate(270) translate(0, -160)">
      <rect x="-30" y="-20" width="60" height="10"/>
      <rect x="-30" y="0" width="24" height="10"/>
      <rect x="6" y="0" width="24" height="10"/>
      <rect x="-30" y="20" width="60" height="10"/>
    </g>
    <!-- 左上：兑 -->
    <g transform="translate(256, 256) rotate(315) translate(0, -160)">
      <rect x="-30" y="-20" width="24" height="10"/>
      <rect x="6" y="-20" width="24" height="10"/>
      <rect x="-30" y="0" width="60" height="10"/>
      <rect x="-30" y="20" width="60" height="10"/>
    </g>
  </g>
</svg>
